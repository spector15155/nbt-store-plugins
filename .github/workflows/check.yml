name: Check plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the packer
        run: python -m unittest tests/test_pack.py
      - name: Download pinned assets and pack each plugin
        run: python tools/pack.py check
