name: Release plugin

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack the tagged plugin
        run: python tools/pack.py release "$GITHUB_REF_NAME" dist
      - name: Publish one asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          title=$(cat dist/title.txt)
          asset=$(cat dist/asset-name.txt)
          test "$asset" = "$(basename "$asset")"
          gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file dist/NOTES.md "dist/$asset"
